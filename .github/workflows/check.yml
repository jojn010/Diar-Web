name: Verify website
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true
      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - run: node --test src/test/js/*.test.mjs
      - uses: gradle/actions/setup-gradle@v6.4.1
      - run: ./gradlew check bootJar --no-daemon
